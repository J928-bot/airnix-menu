<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIRNIX 個別メニュー</title>
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hero" style="background-image:url(/hero_cust.jpg)">
    <p class="k">AIRNIX 用賀店</p>
    <h1 class="t" id="hName">読み込み中…</h1>
    <span class="pill" id="hPlan" hidden></span>
  </div>
  <div id="state" class="pad" style="padding-top:16px"></div>

  <div id="main" hidden>
    <div class="pad" style="padding-top:18px;padding-bottom:22px"><button class="btn line" type="button" id="openRep">今月の効果レポートを見る</button></div>

    <section class="sec">
      <h3>今週の来店</h3>
      <p id="weekMsg"></p>
      <p class="sub" id="streakMsg"></p>
    </section>

    <section class="sec">
      <h2>今日のメニュー</h2>
      <div class="stats">
        <div><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 9V8h-2v6h5v-2h-3zM9 1h6v2H9z"/></svg>30分</div>
        <div><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3zm3 9 2.5 2.5L16 9l-1.4-1.4-4.1 4.1-1.1-1.1L8 12z"/></svg><span id="stage"></span></div>
        <div><svg viewBox="0 0 24 24"><path d="M3 20h4v-6H3v6zm7 0h4V9h-4v11zm7 0h4V4h-4v16z"/></svg><span id="machineName"></span></div>
        <div><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2zm-1 8v10h12V10H6z"/></svg><span id="ntcPer"></span></div>
      </div>
      <p class="box" id="lastNote" hidden></p>
      <div id="menu"></div>
    </section>

    <section class="sec" id="ntcCard"></section>

    <section class="sec">
      <h2>終わったら報告</h2>
      <div class="field"><span>今日のトレーニングはどうでしたか？</span><div class="chips" id="feel"></div></div>
      <div class="field"><span>使ったマシン</span><div class="chips" id="machine"></div></div>
      <div id="ntcAsk" hidden>
        <div class="field"><span id="ntcQ"></span><div class="chips" id="ntcCount"></div></div>
        <div class="field" id="ntcFeelBox" hidden style="margin-top:12px"><span>NTCのきつさ</span><div class="chips" id="ntcFeel"></div></div>
      </div>
      <div class="field"><span>痛みや体調の変化</span><div class="chips" id="pain"></div></div>
      <label class="field"><span>トレッドミルの距離（km・任意）</span><input id="km" type="number" step="0.01" inputmode="decimal" placeholder="2.80"></label>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="button" id="send">報告する</button>
    </section>

    <section class="sec">
      <h3>食事<span class="tiny">　あすけんで記録</span></h3>
      <p style="font-size:14px">食事はあすけん（無料アプリ）で、朝・昼・夕の3食を写真かバーコードで記録してください。AIRNIXでは「今週何日記録したか」だけを伺います。</p>
      <a class="btn line" href="https://apps.apple.com/jp/app/id687287242" target="_blank" rel="noopener">あすけんを開く</a>
      <div class="field"><span>今週、あすけんで記録した日</span><div class="chips" id="asken"></div></div>
    </section>

    <section class="sec">
      <h3>目標まで<span class="tiny" id="goalDate"></span></h3>
      <div id="goal"></div>
      <p class="tiny">体重・ウエストは、来店直後・運動前にスタッフが測ります。</p>
    </section>
  </div>
  <p class="pad tiny" style="padding-top:20px">表示しているのはご本人の記録の数字で、効果をお約束するものではありません。</p>
</div>
<div class="overlay" id="overlay" hidden><div></div></div>

<script>
let D = null, f = {};
const FEEL = [["easy", "楽だった"], ["ok", "ちょうど"], ["hard", "きつかった"]];

async function load() {
  D = await api("/api/me");
  $("hName").textContent = (D.name || "") + (D.status === "pending" ? "" : "様");
  if (D.status === "pending") {
    $("state").innerHTML = `<div class="box">はじめまして。スタッフが初回の測定とメニューの登録をします。受付でこの画面をお見せください。</div>`;
    return;
  }
  $("hPlan").hidden = !D.plan; $("hPlan").textContent = D.plan;
  $("state").innerHTML = D.status === "check" ? `<div class="box d">体調のご報告ありがとうございます。スタッフが確認してから、次のメニューでご案内します。無理をせずお休みしてください。</div>` : "";
  $("main").hidden = false;

  const ws = weekStartOf(D.today), wc = D.visits.filter((d) => d >= ws).length;
  $("weekMsg").innerHTML = wc >= D.weekly ? `今週の目標（週${D.weekly}回）を達成しました。` : `今週はあと<b>${D.weekly - wc}</b>回で目標（週${D.weekly}回）です。`;
  $("streakMsg").textContent = `${D.report.streak}週連続で来店中`;

  $("stage").textContent = "段階 " + "①②③④"[D.ladder.wl - 1];
  $("machineName").textContent = "マシン" + D.ladder.machine;
  $("ntcPer").textContent = "NTC 週" + D.ntc.program.per + "回";
  $("lastNote").hidden = !D.lastNote; $("lastNote").textContent = "前回から：" + D.lastNote;
  $("menu").innerHTML = menuHTML(D.menu);
  $("ntcCard").innerHTML = ntcHTML(D.ntc, "次の来店までに");

  f = { feel: null, machine: D.ladder.machine, pain: false, ntcCount: null, ntcFeel: null };
  chips($("feel"), FEEL, null, (v) => (f.feel = v));
  chips($("machine"), "ABCDEFG".split("").map((x) => [x, x]), D.ladder.machine, (v) => (f.machine = v));
  chips($("pain"), [["0", "なし"], ["1", "あり"]], "0", (v) => (f.pain = v === "1"));
  const askNtc = D.visits.length >= 1;
  $("ntcAsk").hidden = !askNtc;
  if (askNtc) {
    $("ntcQ").textContent = `前回からのNTC（${D.ntc.program.name}）は何回できましたか？（目標 週${D.ntc.program.per}回）`;
    chips($("ntcCount"), Array.from({ length: D.ntc.program.per + 1 }, (_, i) => [i, i + "回"]), null, (v) => { f.ntcCount = +v; $("ntcFeelBox").hidden = +v === 0; });
    chips($("ntcFeel"), FEEL.map(([k, l]) => [k, l.replace("だった", "").replace("かった", "い")]), null, (v) => (f.ntcFeel = v));
  }
  chips($("asken"), Array.from({ length: 8 }, (_, i) => [i, i + "日"]), D.askenThisWeek, async (v) => { await api("/api/asken", { days: +v }); });

  const t = D.target;
  $("goalDate").textContent = t.date ? "　" + t.date.replace(/-/g, "/") + "まで" : "";
  $("goal").innerHTML = (t.weight != null ? `<p class="tiny" style="font-weight:700">体重</p>${trendSVG(D.measurements, "weight", t.weight, "kg")}` : "")
    + (t.waist != null ? `<p class="tiny" style="font-weight:700">ウエスト</p>${trendSVG(D.measurements, "waist", t.waist, "cm")}` : "")
    || `<p class="tiny">目標は来店時にスタッフと決めます。</p>`;
  $("openRep").onclick = () => openReport(reportHTML(D.name, D.report, D.target, D.measurements));
}
function weekStartOf(s) { const d = new Date(s + "T00:00:00Z"), w = d.getUTCDay(); d.setUTCDate(d.getUTCDate() + (w === 0 ? -6 : 1 - w)); return d.toISOString().slice(0, 10); }

$("send").onclick = async () => {
  const e = $("err"); e.hidden = true;
  const miss = [];
  if (!f.feel) miss.push("今日のトレーニング");
  if (!$("ntcAsk").hidden && (f.ntcCount === null || (f.ntcCount > 0 && !f.ntcFeel))) miss.push("NTC");
  if (miss.length) { e.textContent = "未入力：" + miss.join("・"); e.hidden = false; return; }
  const b = $("send"); b.disabled = true;
  try {
    const body = { feel: f.feel, machine: f.machine, pain: f.pain, km: $("km").value };
    if (!$("ntcAsk").hidden) { body.ntcCount = f.ntcCount; body.ntcFeel = f.ntcFeel; }
    await api("/api/report", body);
    $("km").value = "";
    await load();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) { e.textContent = err.message; e.hidden = false; }
  b.disabled = false;
};

(async () => {
  try { if (await boot()) await load(); }
  catch (err) { $("state").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
})();
</script>
</body>
</html>

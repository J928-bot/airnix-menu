<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIRNIX スタッフの画面</title>
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/common.js"></script>
</head>
<body>
<div class="wrap" style="max-width:720px">
  <div class="pad" style="padding-top:20px;display:flex;flex-direction:column;gap:6px">
    <span class="brand">AIRNIX</span>
    <h2>スタッフの画面</h2>
    <p class="sub">上から順に対応してください。声かけの内容は、カードの文章をそのまま使えます。</p>
  </div>
  <div class="pad" style="padding-top:16px"><div class="sum" id="sum"></div></div>
  <p class="pad err" id="err" hidden></p>
  <div class="pad" id="list" style="padding-top:16px;display:flex;flex-direction:column;gap:12px"></div>
</div>
<div class="overlay" id="overlay" hidden><div></div></div>

<script>
let S = null;
const LV = { d: "d", w: "w", a: "a", b: "b" };

async function load() {
  S = await api("/api/staff/members");
  const cnt = (lv) => S.members.filter((m) => m.flags.some((f) => f.level === lv)).length;
  $("sum").innerHTML = `<div><span class="tiny">すぐ対応</span><b>${cnt("d")}</b></div><div><span class="tiny">気にかける</span><b>${cnt("w")}</b></div><div><span class="tiny">案内のタイミング</span><b>${cnt("a")}</b></div><div><span class="tiny">全体</span><b>${S.members.length}</b></div>`;
  $("list").innerHTML = S.members.map(card).join("");
  bind();
}

function card(m) {
  const tags = m.flags.length ? m.flags.map((f) => `<span class="tag ${LV[f.level]}">${esc(f.label)}</span>`).join("") : `<span class="tag">順調</span>`;
  if (m.status === "pending") return `<article class="card"><b style="font-size:18px">${esc(m.lineName || "（LINE名なし）")}</b><div class="tags">${tags}</div><p class="box">${esc(m.flags[0].say)}</p>${regForm(m)}</article>`;
  const up = m.flags.find((f) => f.level === "a");
  const r = m.report;
  return `<article class="card ${m.flags.some((f) => f.level === "d") ? "alert" : ""}">
  <div><b style="font-size:19px">${esc(m.name)}</b><p class="tiny">${esc(m.plan)}・週${m.weekly}回目標・${m.streak}週連続・最終来店 ${md(m.lastVisit)}</p>
  <p class="tiny">トレッドミル：段階${"①②③④"[m.ladder.wl - 1]}・マシン${esc(m.ladder.machine)}・早歩き${f1(m.ladder.fp)}km/h／NTC：${esc(m.ntc.name)} ${m.ntc.week}週目／全${m.ntc.weeks}週</p></div>
  <div class="chips">${Object.entries(S.tracks).map(([k, l]) => `<button type="button" data-track="${esc(m.id)}" data-k="${k}" aria-pressed="${m.ntc.track === k}" style="min-height:30px;padding:2px 10px;font-size:12.5px">${esc(l)}</button>`).join("")}</div>
  <div class="tags">${tags}</div>
  ${m.flags.length ? `<p class="box ${m.flags[0].level === "d" ? "d" : m.flags[0].level === "w" ? "w" : ""}">${esc(m.flags[0].say)}</p>` : ""}
  ${m.status === "check" ? `<button class="btn line" type="button" data-resolve="${esc(m.id)}">体調を確認した（メニューを再開）</button>` : ""}
  ${up && m.upsell ? `<div class="box"><p class="tiny" style="font-weight:700">直近30日の効果レポート</p><p>来店${r.visits}回・NTC${r.ntc}回${r.km ? `・歩いた距離${r.km}km` : ""}${r.dw != null ? `・体重${sg(r.dw)}kg` : ""}${r.dwa != null ? `・ウエスト${sg(r.dwa)}cm` : ""}</p>
    <p class="tiny" style="margin-top:6px">案内：${esc(m.upsell.to)}</p><p>「${esc(m.upsell.say)}」</p></div>
    <div class="two"><button class="btn line" type="button" data-up="${esc(m.id)}" data-r="yes">案内した → 変更する</button><button class="btn line" type="button" data-up="${esc(m.id)}" data-r="no">案内した → 今は見送り</button></div>
    <p class="tiny">「変更する」のときは、hacomonoでもプランを変更してください。</p>` : ""}
  ${m.lastReport ? `<p class="tiny">直近の報告 ${md(m.lastReport.date)}：${esc(m.lastReport.note || "")}</p>` : ""}
  <div class="two"><input type="number" step="0.1" inputmode="decimal" placeholder="体重 kg" data-w="${esc(m.id)}"><input type="number" step="0.1" inputmode="decimal" placeholder="ウエスト cm" data-c="${esc(m.id)}"></div>
  <div class="two"><button class="btn line" type="button" data-measure="${esc(m.id)}">測定を記録</button><button class="btn line" type="button" data-rep="${esc(m.id)}">効果レポート</button></div>
</article>`;
}

function regForm(m) {
  const id = esc(m.id);
  return `<div class="field"><span>お名前</span><input data-f="name" data-id="${id}" placeholder="例：山田 花子"></div>
<div class="two"><label class="field"><span>プラン</span><select data-f="plan" data-id="${id}"><option>メイン</option><option>ライト</option><option>プレミアム</option></select></label>
<label class="field"><span>週の来店目標</span><select data-f="weekly" data-id="${id}"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div>
<label class="field"><span>NTCの目的</span><select data-f="track" data-id="${id}">${Object.entries(S.tracks).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select></label>
<p class="tiny">トレッドミルの基準は、お客様と一緒にトレッドミルで測定した数字を入れてください。</p>
<div class="two"><label class="field"><span>マシン</span><select data-f="machine" data-id="${id}">${"ABCDEFG".split("").map((x) => `<option>${x}</option>`).join("")}</select></label>
<label class="field"><span>きつめの抵抗（A〜C）</span><select data-f="hardRes" data-id="${id}">${[2, 3, 4, 5].map((x) => `<option ${x === 3 ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
<div class="two"><label class="field"><span>ゆっくり km/h</span><input type="number" step="0.1" data-f="walk" data-id="${id}" placeholder="4.5"></label>
<label class="field"><span>早歩き km/h</span><input type="number" step="0.1" data-f="fast" data-id="${id}" placeholder="5.5"></label></div>
<div class="two"><label class="field"><span>今の体重 kg</span><input type="number" step="0.1" data-f="startWeight" data-id="${id}"></label>
<label class="field"><span>今のウエスト cm</span><input type="number" step="0.1" data-f="startWaist" data-id="${id}"></label></div>
<div class="two"><label class="field"><span>目標の体重 kg</span><input type="number" step="0.1" data-f="targetWeight" data-id="${id}"></label>
<label class="field"><span>目標のウエスト cm</span><input type="number" step="0.1" data-f="targetWaist" data-id="${id}"></label></div>
<label class="field"><span>目標の期日</span><input type="date" data-f="targetDate" data-id="${id}"></label>
<button class="btn" type="button" data-register="${id}">登録して開始</button>`;
}

async function act(body) {
  $("err").hidden = true;
  try { await api("/api/staff/members", body); await load(); }
  catch (e) { $("err").textContent = e.message; $("err").hidden = false; window.scrollTo({ top: 0 }); }
}
function bind() {
  document.querySelectorAll("[data-register]").forEach((b) => b.onclick = () => {
    const id = b.dataset.register, body = { action: "register", id };
    document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach((el) => (body[el.dataset.f] = el.value));
    body.weekly = Number(body.weekly);
    act(body);
  });
  document.querySelectorAll("[data-measure]").forEach((b) => b.onclick = () => {
    const id = b.dataset.measure;
    act({ action: "measure", id, weight: document.querySelector(`[data-w="${CSS.escape(id)}"]`).value, waist: document.querySelector(`[data-c="${CSS.escape(id)}"]`).value });
  });
  document.querySelectorAll("[data-resolve]").forEach((b) => b.onclick = () => act({ action: "resolve", id: b.dataset.resolve }));
  document.querySelectorAll("[data-track]").forEach((b) => b.onclick = () => {
    if (b.getAttribute("aria-pressed") === "true") return;
    if (confirm("NTCの目的を変えると、その目的の1本目のプログラムからやり直しになります。変更しますか？")) act({ action: "track", id: b.dataset.track, track: b.dataset.k });
  });
  document.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => act({ action: "upsell", id: b.dataset.up, result: b.dataset.r }));
  document.querySelectorAll("[data-rep]").forEach((b) => b.onclick = () => {
    const m = S.members.find((x) => x.id === b.dataset.rep);
    openReport(reportHTML(m.name, m.report, m.target, m.measurements));
  });
}

(async () => {
  try { if (await boot()) await load(); }
  catch (e) { $("err").textContent = e.message; $("err").hidden = false; }
})();
</script>
</body>
</html>
